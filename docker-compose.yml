# Standalone: mkdir -m 700 data, docker compose up -d, then open the link in data/setup-link.txt to make the first admin's
# passkey (published on this machine only; nobody becomes admin by arriving first).
# Keepsake keeps data/ and its files for its own user only (0700, 0600). Back up data/ as you like. From M3 a keys/ folder holds the key that seals the draws: keep its copy apart.
services:
  keepsake:
    image: ${KEEPSAKE_IMAGE:-keepsake:0.1.0}
    build: .
    user: "${KEEPSAKE_UID:-1000}:${KEEPSAKE_GID:-1000}"
    environment:
      KEEPSAKE_MODE: standalone
      # The address you open; passkeys are bound to it (https, or http://localhost).
      KEEPSAKE_ORIGIN: ${KEEPSAKE_ORIGIN:-http://localhost:${KEEPSAKE_PORT:-8080}}
      KEEPSAKE_DATA_DIR: /data
      KEEPSAKE_TZ: ${KEEPSAKE_TZ:-UTC}
    volumes: [ "./data:/data:Z" ]
    ports: [ "127.0.0.1:${KEEPSAKE_PORT:-8080}:8080" ]
    read_only: true
    tmpfs: [ /tmp ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    pids_limit: 64
    restart: unless-stopped
