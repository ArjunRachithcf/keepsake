# Standalone: mkdir data, docker compose up -d, open http://localhost:8080 (published on this machine only).
# Back up data/ as you like. From M3 a keys/ folder holds the key that seals the draws: keep its copy apart.
services:
  keepsake:
    image: ${KEEPSAKE_IMAGE:-keepsake:0.1.0}
    build: .
    user: "${KEEPSAKE_UID:-1000}:${KEEPSAKE_GID:-1000}"
    environment:
      KEEPSAKE_MODE: standalone
      KEEPSAKE_DATA_DIR: /data
      KEEPSAKE_TZ: ${KEEPSAKE_TZ:-Europe/Zurich}
    volumes: [ "./data:/data:Z" ]
    ports: [ "127.0.0.1:${KEEPSAKE_PORT:-8080}:8080" ]
    read_only: true
    tmpfs: [ /tmp ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped
