# Standalone: mkdir -m 700 data keys, docker compose up -d, then open the link in data/setup-link.txt to make the first
# admin's passkey (published on this machine only; nobody becomes admin by arriving first).
# Keepsake keeps data/ and its files for its own user only (0700, 0600). Back up data/ as you like. keys/ holds the key
# that seals the draws (keys/sealing.key, made at the first start, ADR 0004): keep its copy apart (a password manager,
# say), never in the same backup as data/, or a copy of both opens every draw.
services:
  keepsake:
    image: ${KEEPSAKE_IMAGE:-keepsake:0.1.0}
    build: .
    user: "${KEEPSAKE_UID:-1000}:${KEEPSAKE_GID:-1000}"
    environment:
      KEEPSAKE_MODE: standalone
      # The address you open; passkeys are bound to it (https, or http://localhost).
      KEEPSAKE_ORIGIN: ${KEEPSAKE_ORIGIN:-http://localhost:${KEEPSAKE_PORT:-8080}}
      KEEPSAKE_DATA_DIR: /data
      KEEPSAKE_KEYS_DIR: /keys
      # The key is a file in keys/ (made at the first start), never a value here: a value would show in `docker inspect`.
      KEEPSAKE_TZ: ${KEEPSAKE_TZ:-UTC}
    volumes: [ "./data:/data:Z", "./keys:/keys:Z" ]
    ports: [ "127.0.0.1:${KEEPSAKE_PORT:-8080}:8080" ]
    read_only: true
    tmpfs: [ /tmp ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    pids_limit: 64
    restart: unless-stopped
