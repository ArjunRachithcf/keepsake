# HomersLab catalog manifest (shape to align with HomersLab's feedstock format when it is final; modelled on Philobiblos')
id: keepsake
name: Keepsake
tagline: Wishes, celebrations and draws for a family, the surprise kept
category: Family
icon: icon.svg
version: 0.1.0
image: ghcr.io/<owner>/keepsake:0.1.0@sha256:<digest>   # placeholders until the first release; scripts/check-release.sh refuses them
ports: [{ container: 8080, protocol: http, public: false }]
volumes: [{ name: data, mount: /data, backup: true, description: 'SQLite database (keepsake.sqlite: household, wishes, celebrations, profiles; sealed draws, which open only with KEEPSAKE_SEALING_KEY)' }]
env:
  KEEPSAKE_MODE: homerslab
  KEEPSAKE_DATA_DIR: /data
  # Not set here: HomersLab gives KEEPSAKE_ORIGIN, KEEPSAKE_TRUSTED_PROXY (the edge's address on the app network) and,
  # once its edge keeps identity.edge's promise, KEEPSAKE_EDGE_IDENTITY (ADR 0001). Keepsake refuses to start in
  # homerslab mode without all three.
identity:
  # Required of HomersLab, not set by Keepsake: the edge deletes every X-HomersLab-* header a client sends and sets the
  # three below itself (HomersLab #236). HomersLab answers by setting KEEPSAKE_EDGE_IDENTITY to this value.
  edge: homerslab-v1
  forwarded_header: X-HomersLab-Person     # stable person id
  forwarded_name_header: X-HomersLab-Name
  forwarded_role_header: X-HomersLab-Role  # admin | adult | kid
  household_api: true                      # later: who manages which kid (until then Keepsake's admins set kids' parents)
audience: household                        # adults and kids (kids' wishes wait for a parent, spec §2)
# Guests by link (ADR 0009) have no HomersLab account: the edge lets these through without a sign-in (and still strips
# every X-HomersLab-* header). /api/guest/* takes only Keepsake's own guest session; everything else stays behind sign-in.
guest_paths: [/guest, /assets/*, /api/guest, /api/guest/*]
secrets:
  - { key: KEEPSAKE_SEALING_KEY, file: true, description: 'Key that seals the draw assignments (32 bytes, base64; outside the database and its backup, ADR 0004). Without it Keepsake runs but makes and opens no draw' }
  - { key: KEEPSAKE_VAPID_KEY, file: true, description: 'Web Push key (a P-256 private scalar, 32 bytes, base64 or base64url; outside the database and its backup, ADR 0010). Without it Keepsake sends no push (the news still shows in the app)' }
config:
  - { key: KEEPSAKE_TZ, optional: true, description: "The household's time zone (IANA, e.g. Europe/Berlin; default UTC): celebrations' days, the morning batch" }
  - { key: KEEPSAKE_ORIGIN, description: "The app's address (https://…), set by HomersLab: WebAuthn's origin and the Origin every change must carry" }
  - { key: KEEPSAKE_SHOP_HOSTS, optional: true, description: 'Shops whose pages "Add from a link" may read (exact host names, comma separated; none by default: the feature is off). Each is egress (ADR 0011)' }
  - { key: KEEPSAKE_VAPID_SUBJECT, optional: true, description: 'Who runs this Keepsake, for the push services (mailto: or https:; default mailto:keepsake@example.org, which names no household)' }
  - { key: KEEPSAKE_EGRESS, optional: true, description: 'off: nothing leaves Keepsake (no push, no shop page); default on' }
network:
  # Philobiblos' convention (PR #12 review, N2). Enforced by Keepsake's one egress client as well (ADR 0011): https on
  # 443, public addresses only, nothing else reachable. The shops the household lists in KEEPSAKE_SHOP_HOSTS (comma
  # separated, none by default: "Add from a link" is off), redirects only to another listed shop.
  egress: ['${KEEPSAKE_SHOP_HOSTS}']
  # Web Push (ADR 0010): the browsers' push services, https on 443; only the encrypted, fixed {"v":1}.
  push_egress: [fcm.googleapis.com, updates.push.services.mozilla.com, web.push.apple.com, '*.notify.windows.com']
health: /api/health
resources: { memory: 256Mi, cpu: 0.25 }
