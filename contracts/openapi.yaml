        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [guest]
      operationId: guestUnclaim
      summary: 'The guest takes their claim back'
      security: [ { guestSession: [] } ]
      parameters: [ { $ref: '#/components/parameters/guestLink' } ]
      responses:
        '204': { description: Taken back }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /guest/questions:
    post:
      tags: [guest]
      operationId: guestAsk
      summary: 'The guest asks their link''s person (a draw guest: their own person, once opened) one anonymous question'
      security: [ { guestSession: [] } ]
      parameters: [ { $ref: '#/components/parameters/guestLink' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionInput' }
      responses:
        '201': { $ref: '#/components/responses/AskedAnswer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /guest/sign-out:
    post:
      tags: [guest]
      operationId: endGuest
      summary: 'Ends this browser''s guest session'
      security: [ { guestSession: [] } ]
      parameters: [ { $ref: '#/components/parameters/guestLink' } ]
      responses:
        '204': { description: Ended }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /notices:
    get:
      tags: [notices]
      operationId: listNotices
      summary: 'What is new for the caller, newest first (pointers to celebrations, questions and thank-yous, as the caller may see them now)'
      responses:
        '200':
          description: The notices
          content: { application/json: { schema: { $ref: '#/components/schemas/Notices' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /notices/read:
    post:
      tags: [notices]
      operationId: readNotices
      summary: The caller has seen their notices
      responses:
        '204': { description: Marked read }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /push:
    get:
      tags: [notices]
      operationId: pushInfo
      summary: 'Whether this server sends Web Push, and its public (VAPID) key for a browser''s subscription'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/PushInfo' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /push/subscription:
    put:
      tags: [notices]
      operationId: subscribePush
      summary: 'This device''s push subscription for the caller (standalone: it ends with this session). Endpoints only on a known push service'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscriptionInput' }
      responses:
        '204': { description: Subscribed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /push/unsubscribe:
    post:
      tags: [notices]
      operationId: unsubscribePush
      summary: 'Ends a device''s subscription (the caller''s own only; another''s endpoint changes nothing)'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EndpointInput' }
      responses:
        '204': { description: Unsubscribed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /people/{personId}/reminder:
    parameters:
      - { $ref: '#/components/parameters/personId' }
    put:
      tags: [notices]
      operationId: setReminder
      summary: '"Remind me": a notice at the morning batch `days` before each of their celebrations (null: no more). Only the caller sees it'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReminderInput' }
      responses:
        '204': { description: Set }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /wishes/{wishId}/thanks:
    parameters:
      - { $ref: '#/components/parameters/wishId' }
    put:
      tags: [notices]
      operationId: writeThanks
      summary: 'After the celebration, the person (or a kid''s parent) thanks the givers of a gift they received, named or not; who the givers are is never sent back. Once'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThanksInput' }
      responses:
        '200':
          description: The received gift with its thank-you
          content: { application/json: { schema: { $ref: '#/components/schemas/Thanks' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /link-preview:
    post:
      tags: [add-from-a-link]
      operationId: previewLink
      summary: 'Reads a shop''s page (only the shops on the server''s list) for a wish''s name and price; nothing is stored'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkPreviewInput' }
      responses:
        '200':
          description: 'What the page says: a proposal to change and save as any wish'
          content: { application/json: { schema: { $ref: '#/components/schemas/LinkPreview' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    homerslabPerson:
      type: apiKey
      in: header
      name: X-HomersLab-Person
      description: 'homerslab mode: set by the edge with X-HomersLab-Name and X-HomersLab-Role, trusted only from KEEPSAKE_TRUSTED_PROXY (the socket address) once KEEPSAKE_EDGE_IDENTITY=homerslab-v1 (ADR 0001)'
    session:
      type: apiKey
      in: cookie
      name: __Host-keepsake_session
      description: 'standalone: a passkey session (HttpOnly; Secure; SameSite=Strict; 30 days, 7 idle)'
    guestSession:
      type: apiKey
      in: cookie
      name: __Host-keepsake_guest
      description: 'A guest''s device (ADR 0009), from POST /guest/session: 256 random bits, HttpOnly; Secure; SameSite=Strict; 400 days. It holds the sessions of every link it opened; each /guest/* request names its link in the X-Keepsake-Link header. A session lasts as long as its link (at most 400 days), ends after 30 days unused and at a household sign-in in that browser'

  parameters:
    guestLink:
      name: X-Keepsake-Link
      in: header
      required: true
      description: 'The link a guest request is for (its id, from the guest page): the device''s session of that link counts'
      schema: { $ref: '#/components/schemas/Id' }
    personId:
      name: personId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    wishId:
      name: wishId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    celebrationId:
      name: celebrationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    questionId:
      name: questionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ideaId:
      name: ideaId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    linkId:
      name: linkId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    passkeyId:
      name: passkeyId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,1400}$' }
    for:
      name: for
      in: query
      required: false
      description: 'A celebration''s id (its wishes and the any-time ones: the list for it), or `any` (any-time wishes only); absent: all'
      schema: { type: string, pattern: '^(any|[0-9A-Za-z_-]{1,40})$' }

  responses:
    BadRequest:
      description: The request is not valid
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Sign in first
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Not allowed (or a change without Keepsake's Origin)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: No such thing, or not one the caller may see
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Not possible in this state
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    GiverWish:
      description: The wish as the giver sees it now (with its gifts)
      content: { application/json: { schema: { $ref: '#/components/schemas/Wish' } } }
    DrawAnswer:
      description: The draw as the caller may see it now
      content: { application/json: { schema: { $ref: '#/components/schemas/Draw' } } }
    AskedAnswer:
      description: The question as its asker sees it
      content: { application/json: { schema: { $ref: '#/components/schemas/AskedQuestion' } } }
    LinkMade:
      description: The link, and its address (shown this once)
      content: { application/json: { schema: { $ref: '#/components/schemas/GuestLinkMade' } } }
    GuestAnswer:
      description: What the guest's link reaches now
      content: { application/json: { schema: { $ref: '#/components/schemas/GuestPage' } } }
    GuestWish:
      description: The wish as the guest sees it now
      content: { application/json: { schema: { $ref: '#/components/schemas/Wish' } } }
    TooMany:
      description: Too many tries; wait a minute
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Id: { type: string, pattern: '^[0-9A-Za-z_-]{1,40}$' }
    DateTime: { type: string, format: date-time }
    Day: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', description: 'YYYY-MM-DD' }
    Role: { enum: [admin, adult, kid] }
    Mode: { enum: [homerslab, standalone] }

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }

    Health:
      type: object
      additionalProperties: false
      required: [ok, version, mode]
      properties:
        ok: { type: boolean }
        version: { type: string }
        mode: { $ref: '#/components/schemas/Mode' }

    PersonRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }

    Person:
      type: object
      additionalProperties: false
      required: [id, name, role, managers, signsIn]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        managers:
          description: A kid's managers as set (empty for a grown-up, or when the admins manage the kid)
          type: array
          items: { $ref: '#/components/schemas/Id' }
        signsIn:
          description: 'Standalone: whether they have a passkey; null under HomersLab'
          type: [boolean, 'null']

    AuthSession:
      type: object
      additionalProperties: false
      required: [mode, signedIn, setupNeeded]
      properties:
        mode: { $ref: '#/components/schemas/Mode' }
        signedIn: { type: boolean }
        setupNeeded: { type: boolean }
        person: { $ref: '#/components/schemas/Person' }

    EnrolOptionsInput:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        name: { type: string, minLength: 1, maxLength: 60, description: 'The first admin''s name (setup link only)' }

    CredentialInput:
      type: object
      additionalProperties: false
      required: [challengeId, response]
      properties:
        challengeId: { type: string }
        response: { type: object, additionalProperties: true, description: 'The authenticator''s answer (WebAuthn JSON)' }
        label: { type: string, maxLength: 40, description: 'A name for the new passkey (enrolment only)' }

    EnrolStart:
      type: object
      additionalProperties: false
      required: [challengeId, options, person]
      properties:
        challengeId: { type: string }
        options: { type: object, additionalProperties: true }
        person:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { type: string }

    SignInStart:
      type: object
      additionalProperties: false
      required: [challengeId, options]
      properties:
        challengeId: { type: string }
        options: { type: object, additionalProperties: true }

    OneTimeLink:
      type: object
      additionalProperties: false
      required: [url, expiresAt]
      properties:
        url: { type: string, description: 'The token is in the #fragment' }
        expiresAt: { $ref: '#/components/schemas/DateTime' }

    Passkey:
      type: object
      additionalProperties: false
      required: [id, label, createdAt, lastUsedAt, backedUp, invitedBy]
      properties:
        id: { type: string }
        label: { type: string }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        backedUp: { type: boolean, description: 'Synced by its platform (it survives a lost device)' }
        invitedBy: { type: [string, 'null'], description: 'The admin whose invite made it' }

    Passkeys:
      type: object
      additionalProperties: false
      required: [passkeys]
      properties:
        passkeys: { type: array, items: { $ref: '#/components/schemas/Passkey' } }

    Household:
      type: object
      additionalProperties: false
      required: [mode, me, people, currency, addFromLink]
      properties:
        addFromLink: { type: boolean, description: 'Whether this server reads shop pages for "Add from a link" (ADR 0011: it lists shops, and egress is on)' }
        mode: { $ref: '#/components/schemas/Mode' }
        me: { $ref: '#/components/schemas/Person' }
        people: { type: array, items: { $ref: '#/components/schemas/Person' } }
        currency:
          description: 'ISO 4217; null until an admin sets it (prices wait for it)'
          type: [string, 'null']

    HouseholdPatch:
      type: object
      additionalProperties: false
      required: [currency]
      properties:
        currency:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'

    PersonInput:
      type: object
      additionalProperties: false
      required: [name, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        role: { $ref: '#/components/schemas/Role' }
        confirmName: { type: boolean, description: 'true: the name is like a guest''s by link (409 without it), and that is meant' }

    PersonPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        role: { $ref: '#/components/schemas/Role' }
        confirmName: { type: boolean, description: 'true: the new name is like a guest''s by link (409 without it), and that is meant' }

    ManagersInput:
      type: object
      additionalProperties: false
      required: [managerIds]
      properties:
        managerIds: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Id' } }

    Size:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label: { type: string, minLength: 1, maxLength: 40 }
        value: { type: string, minLength: 1, maxLength: 40 }

    Profile:
      type: object
      additionalProperties: false
      required: [sizes, sizesUpdatedAt, likes, likesUpdatedAt, pleaseNo, pleaseNoUpdatedAt]
      properties:
        sizes: { type: array, items: { $ref: '#/components/schemas/Size' } }
        sizesUpdatedAt: { type: [string, 'null'], format: date-time }
        likes: { type: array, items: { type: string } }
        likesUpdatedAt: { type: [string, 'null'], format: date-time }
        pleaseNo: { type: array, items: { type: string } }
        pleaseNoUpdatedAt: { type: [string, 'null'], format: date-time }

    ProfileInput:
      type: object
      additionalProperties: false
      properties:
        sizes: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/Size' } }
        likes: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 80 } }
        pleaseNo: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 80 } }

    WishState:
      description: 'listed: the household sees it; awaiting_parent: a kid''s, until a manager approves; suggested: someone else''s idea, until the person approves'
      enum: [listed, awaiting_parent, suggested]

    Wish:
      type: object
      additionalProperties: false
      required: [id, personId, celebrationId, name, link, priceMinor, quantity, note, mostWanted, state, addedBy, createdAt, updatedAt, canEdit, canApprove]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        personId: { $ref: '#/components/schemas/Id' }
        celebrationId:
          description: The celebration it is for; null for any time
          anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
        name: { type: string }
        link: { type: [string, 'null'], description: 'As typed; Keepsake never fetches it' }
        priceMinor: { type: [integer, 'null'], description: 'In minor units of the household currency' }
        quantity: { type: integer, minimum: 1 }
        note: { type: [string, 'null'] }
        mostWanted: { type: boolean }
        state: { $ref: '#/components/schemas/WishState' }
        addedBy:
          description: Who added it, when someone other than the person did (a suggestion, a parent)
          anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }]
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        canEdit: { type: boolean }
        canApprove: { type: boolean }
        gift:
          description: 'Only for a giver (not its person, not a kid): absent, not null, for everyone else, whatever the gifts are'
          $ref: '#/components/schemas/Gift'

    ClaimState: { enum: [claimed, bought, given] }
    GroupState: { enum: [open, bought, given] }

    Gift:
      description: 'A wish''s gifts, only ever for a giver: never its person, never a kid (ADR 0003). Others'' shares are names, not amounts.'
      type: object
      additionalProperties: false
      required: [claimed, left, given, claims, group, mine]
      properties:
        claimed: { type: integer, minimum: 0, description: 'How many are claimed' }
        left: { type: integer, minimum: 0, description: 'How many are left to claim (0 for a group gift)' }
        given: { type: boolean, description: 'All given: gone from every list for givers' }
        claims: { type: array, items: { $ref: '#/components/schemas/Claim' } }
        group:
          anyOf: [{ $ref: '#/components/schemas/GroupGift' }, { type: 'null' }]
        mine:
          description: The caller's own claim or share
          anyOf: [{ $ref: '#/components/schemas/MyGift' }, { type: 'null' }]

    Claim:
      type: object
      additionalProperties: false
      required: [giver, guest, imported, quantity, state, mine]
      properties:
        giver: { anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        guest: { description: 'A guest''s claim: the guest, marked as one (null like `giver` while a draw keeps givers unnamed, and always to a guest)', anyOf: [{ $ref: '#/components/schemas/GuestRef' }, { type: 'null' }] }
        imported: { type: boolean, description: 'An imported reservation: a Reserved row of the sheet whose buyer is nobody here (nobody''s claim; an admin releases it)' }
        quantity: { type: integer, minimum: 1 }
        state: { $ref: '#/components/schemas/ClaimState' }
        mine: { type: boolean }

    GuestRef:
      type: object
      additionalProperties: false
      required: [name, label]
      properties:
        name: { type: string, description: 'The name the guest gave (never a household member''s)' }
        label: { type: string, description: 'Who the link is for, as its maker wrote it' }

    GroupGift:
      type: object
      additionalProperties: false
      required: [organizer, targetMinor, enough, state, givers, myShareMinor, canManage]
      properties:
        organizer: { anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        targetMinor: { type: integer, minimum: 1 }
        enough: { type: boolean, description: 'Whether the shares together reach the target. Never the total: with two sharers it would give the other''s amount (ADR 0003)' }
        state: { $ref: '#/components/schemas/GroupState' }
        givers:
          type: array
          description: Who chipped in (names only)
          items:
            type: object
            additionalProperties: false
            required: [giver, mine]
            properties:
              giver: { anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
              mine: { type: boolean }
        myShareMinor: { type: [integer, 'null'] }
        canManage: { type: boolean }

    MyGift:
      type: object
      additionalProperties: false
      required: [state, named, over, celebrationId, forDate]
      properties:
        state: { enum: [claimed, bought, given, open] }
        named: { type: boolean, description: 'Your name is on it for the person (after the celebration)' }
        over: { type: boolean, description: 'Given, and its celebration is over: you may put your name on it' }
        celebrationId: { description: 'The occasion it counts for, as the wish is now (computed when read)', anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        forDate: { description: 'That occasion''s day (once given, never earlier than the day kept then); its person learns of a given gift the day after the later of this and the day it was given', anyOf: [{ $ref: '#/components/schemas/Day' }, { type: 'null' }] }

    CelebrationRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }

    Thanks:
      description: A gift the caller (or a kid they are a parent of) received, after its celebration; `from` names only the givers who chose to
      type: object
      additionalProperties: false
      required: [wish, celebration, on, from, sent]
      properties:
        wish: { $ref: '#/components/schemas/Wish' }
        celebration: { anyOf: [{ $ref: '#/components/schemas/CelebrationRef' }, { type: 'null' }] }
        on: { $ref: '#/components/schemas/Day' }
        from: { type: array, items: { $ref: '#/components/schemas/PersonRef' } }
        sent:
          description: 'The thank-you written for it (it went to every giver of it in the household, named or not; never who they are), or null'
          anyOf:
            - type: object
              additionalProperties: false
              required: [text, on, by]
              properties:
                text: { type: string }
                on: { $ref: '#/components/schemas/Day' }
                by: { anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
            - { type: 'null' }

    ThankedYou:
      description: A thank-you for a gift the caller gave
      type: object
      additionalProperties: false
      required: [id, wish, from, by, text, on]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        wish: { $ref: '#/components/schemas/WishRef' }
        from: { description: 'Whose gift it was', anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        by: { description: 'A kid''s parent who wrote it for the kid, else null', anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        text: { type: string }
        on: { $ref: '#/components/schemas/Day' }

    ThanksInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }

    Notice:
      description: 'A pointer to something new (ADR 0010): question, its person''s question reached them (a kid''s: their parents); answered, the caller''s question was answered; draw, names drawn (or drawn again, or cleared); remind, a celebration coming (person: whose, for "Remind me"); reveal, a draw''s pairs show; say_thanks, gifts reached the caller; thanked, someone thanked the caller (person: whose gift)'
      type: object
      additionalProperties: false
      required: [id, kind, on, read, celebration, person, question, by]
      properties:
        id: { type: string }
        kind: { type: string, enum: [question, answered, draw, remind, reveal, say_thanks, thanked, reset_asked, signin_reset, new_admin, sessions_ended, target_raised], description: 'reset_asked: someone asked to reset the sign-in of `person` (to them, the other admins, the people of their open draws, a kid''s parents); signin_reset: it was reset (to the same); `by`: who asked. new_admin: `person` became an admin (to everyone, at the morning batch); sessions_ended: `by` signed the caller out everywhere (`person`: the caller, or a kid of theirs); target_raised: the target of a group gift the caller chipped in to went up (`person`: whose wish; at the morning batch)' }
        on: { $ref: '#/components/schemas/Day' }
        read: { type: boolean }
        celebration: { anyOf: [{ $ref: '#/components/schemas/CelebrationRef' }, { type: 'null' }] }
        person: { anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        question: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        by: { anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }

    PasskeyReset:
      type: object
      additionalProperties: false
      required: [state, waitsFor, notBefore, askedBy, approvedBy]
      properties:
        state: { type: string, enum: [asked, done] }
        waitsFor: { type: [string, 'null'], enum: [a_day, an_hour, null], description: 'Asked: a day after the ask (its asker alone), or an hour after a long-standing second admin''s yes' }
        notBefore: { anyOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }], description: 'Asked: when it may be carried out (by its asker, or by the admin who said yes)' }
        askedBy: { anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        approvedBy: { anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }], description: 'The second admin whose yes counts: an admin, with a passkey, a week before the ask, not enrolled by its asker' }

    Notices:
      type: object
      additionalProperties: false
      required: [notices, unread]
      properties:
        notices: { type: array, items: { $ref: '#/components/schemas/Notice' } }
        unread: { type: integer, minimum: 0 }

    PushInfo:
      type: object
      additionalProperties: false
      required: [available, publicKey]
      properties:
        available: { type: boolean }
        publicKey: { description: 'The applicationServerKey (base64url, P-256)', anyOf: [{ type: string }, { type: 'null' }] }

    PushSubscriptionInput:
      description: 'PushSubscription.toJSON(): the endpoint must be on a push service the server knows (Google, Mozilla, Apple, Microsoft), https'
      type: object
      additionalProperties: false
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, maxLength: 1000 }
        expirationTime: { anyOf: [{ type: number }, { type: 'null' }] }
        sync: { type: boolean, description: 'The app sending it again by itself (at a start, when shown): it only confirms a subscription that is the caller''s or new, and never moves one from another person; only the switch (no sync) does' }
        keys:
          type: object
          additionalProperties: false
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }

    EndpointInput:
      type: object
      additionalProperties: false
      required: [endpoint]
      properties:
        endpoint: { type: string, maxLength: 1000 }

    ReminderInput:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days: { anyOf: [{ type: integer, minimum: 1, maximum: 60 }, { type: 'null' }] }

    LinkPreviewInput:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, maxLength: 2000 }

    LinkPreview:
      type: object
      additionalProperties: false
      required: [link, name, priceMinor, pagePrice]
      properties:
        link: { type: string, description: 'The link as given (what a wish keeps)' }
        name: { anyOf: [{ type: string, maxLength: 120 }, { type: 'null' }] }
        priceMinor: { description: 'The page''s price, only when it is in the household''s currency', anyOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        pagePrice:
          description: 'The price as the page states it, in its currency'
          anyOf:
            - type: object
              additionalProperties: false
              required: [currency, amountMinor]
              properties:
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                amountMinor: { type: integer, minimum: 0 }
            - { type: 'null' }

    Gave:
      description: A gift the caller gave, after its celebration
      type: object
      additionalProperties: false
      required: [wish, celebration, on, named]
      properties:
        wish: { $ref: '#/components/schemas/Wish' }
        celebration: { anyOf: [{ $ref: '#/components/schemas/CelebrationRef' }, { type: 'null' }] }
        on: { $ref: '#/components/schemas/Day' }
        named: { type: boolean }

    ClaimInput:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 99 }

    ClaimPatch:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { $ref: '#/components/schemas/ClaimState' }

    NamedInput:
      type: object
      additionalProperties: false
      required: [named]
      properties:
        named: { type: boolean }

    GroupInput:
      type: object
      additionalProperties: false
      required: [targetMinor]
      properties:
        targetMinor: { type: integer, minimum: 1, maximum: 100000000 }

    GroupPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        targetMinor: { type: integer, minimum: 1, maximum: 100000000 }
        state: { $ref: '#/components/schemas/GroupState' }

    ShareInput:
      type: object
      additionalProperties: false
      required: [amountMinor]
      properties:
        amountMinor: { type: integer, minimum: 1, maximum: 100000000 }

    WishInput:
      type: object
      additionalProperties: false
      required: [personId, name, celebrationId]
      properties:
        personId: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1, maxLength: 120 }
        link: { type: [string, 'null'], maxLength: 2000, description: 'http(s) only, without credentials; stored, never fetched' }
        priceMinor: { type: [integer, 'null'], minimum: 0, maximum: 100000000, description: 'Needs the household''s currency' }
        quantity: { type: integer, minimum: 1, maximum: 99, description: 'Default 1' }
        note: { type: [string, 'null'], maxLength: 500 }
        mostWanted: { type: boolean }
        celebrationId:
          description: A celebration the person is part of, or null for any time
          anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]

    WishPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        link: { type: [string, 'null'], maxLength: 2000 }
        priceMinor: { type: [integer, 'null'], minimum: 0, maximum: 100000000 }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        note: { type: [string, 'null'], maxLength: 500 }
        mostWanted: { type: boolean }
        celebrationId:
          anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]

    WishOrder:
      type: object
      additionalProperties: false
      required: [wishIds]
      properties:
        wishIds: { type: array, maxItems: 300, items: { $ref: '#/components/schemas/Id' } }

    QuestionInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 200 }

    AnswerInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }

    AnswerWishInput:
      description: 'A wish for the question''s person, as in WishInput (without personId)'
      type: object
      additionalProperties: false
      required: [name, celebrationId]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        link: { type: [string, 'null'], maxLength: 2000 }
        priceMinor: { type: [integer, 'null'], minimum: 0, maximum: 100000000 }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        note: { type: [string, 'null'], maxLength: 500 }
        mostWanted: { type: boolean }
        celebrationId:
          anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]

    WishRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }

    AskedQuestion:
      description: 'A question as a giver sees it: never who asked; `mine` for the caller''s own'
      type: object
      additionalProperties: false
      required: [id, text, on, state, answer, wish, mine, arrivesAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        text: { type: string }
        on: { $ref: '#/components/schemas/Day', description: 'The morning it reaches (or reached) its person' }
        state: { enum: [waiting, open, answered, declined], description: 'waiting: not delivered yet (only its asker sees it); declined: only its asker sees it' }
        answer: { type: [string, 'null'] }
        wish: { description: 'Answered with a wish ("Add a wish instead")', anyOf: [{ $ref: '#/components/schemas/WishRef' }, { type: 'null' }] }
        mine: { type: boolean }
        arrivesAt: { description: 'For the caller''s own, until it is delivered: when (08:00 household time)', anyOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }

    QuestionToAnswer:
      type: object
      additionalProperties: false
      required: [id, text, on, for]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        text: { type: string }
        on: { $ref: '#/components/schemas/Day' }
        for: { $ref: '#/components/schemas/PersonRef', description: 'Whose wishes it is about: the caller, or a kid of theirs' }

    IdeaInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 200 }

    Idea:
      type: object
      additionalProperties: false
      required: [id, text, by, mine, on]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        text: { type: string }
        by: { description: 'Who keeps it (null while a draw keeps its people unnamed to each other, or once they left)', anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        mine: { type: boolean }
        on: { $ref: '#/components/schemas/Day', description: 'The day it was written (household time): never the moment' }

    GuestLink:
      type: object
      additionalProperties: false
      required: [id, kind, label, guestName, person, celebration, lastDay, createdAt, openedAt, revokedAt, reissuedAt, reissueCount]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { enum: [share, draw] }
        label: { type: string, description: 'Who it is for, as its maker wrote it' }
        guestName: { type: [string, 'null'], description: 'The name the guest gave' }
        person: { description: 'A share link: whose wishes', anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        celebration: { description: 'A draw link: whose draw', anyOf: [{ $ref: '#/components/schemas/CelebrationRef' }, { type: 'null' }] }
        lastDay: { description: 'A draw link: the last day it works (the draw''s day, household time)', anyOf: [{ $ref: '#/components/schemas/Day' }, { type: 'null' }] }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        openedAt: { description: 'When it was opened, on its one device (null: not yet)', anyOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        revokedAt: { anyOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        reissuedAt: { description: 'When it last got a new address (null: never)', anyOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        reissueCount: { type: integer, minimum: 0, description: 'How many new addresses it got' }

    GuestLinks:
      type: object
      additionalProperties: false
      required: [links]
      properties:
        links: { type: array, items: { $ref: '#/components/schemas/GuestLink' } }

    GuestLinkMade:
      type: object
      additionalProperties: false
      required: [link, url]
      properties:
        link: { $ref: '#/components/schemas/GuestLink' }
        url: { type: string, description: 'Shown this once: the token is in the #fragment and only its hash is kept' }

    ShareLinkInput:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 60, description: 'Who it is for (Godmother, the neighbours)' }

    DrawLinkInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60, description: 'The guest''s name' }

    GuestTokenInput:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }

    GuestNameInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }

    GuestPage:
      type: object
      additionalProperties: false
      required: [link, kind, name, currency, person, profile, celebration, draw, wishes, questions, lastDay, reissued]
      properties:
        link: { $ref: '#/components/schemas/Id', description: 'The link''s id: the guest page names it in X-Keepsake-Link' }
        kind: { enum: [share, draw] }
        name: { type: [string, 'null'], description: 'The guest''s own name (claims wait for it)' }
        currency: { type: [string, 'null'] }
        person: { description: 'Whose wishes the guest sees: the share link''s person, or a draw guest''s own person once opened (null before, or when it is another guest)', anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        profile: { description: 'That person''s sizes, likes and "please no", read-only (null while there is no person)', anyOf: [{ $ref: '#/components/schemas/Profile' }, { type: 'null' }] }
        celebration:
          description: A draw link's celebration
          anyOf:
            - type: object
              additionalProperties: false
              required: [id, name, date, place, poster]
              properties:
                id: { $ref: '#/components/schemas/Id' }
                name: { type: string }
                date: { $ref: '#/components/schemas/Day', description: 'The draw''s day' }
                place: { type: [string, 'null'] }
                poster: { $ref: '#/components/schemas/Poster' }
            - { type: 'null' }
        draw:
          anyOf:
            - type: object
              additionalProperties: false
              required: [drawn, opened, canOpen, total, openedCount, budgetMinor, drawTogetherAt, receiverGuest]
              properties:
                drawn: { type: boolean }
                opened: { type: boolean }
                canOpen: { type: boolean }
                total: { type: integer }
                openedCount: { type: integer }
                budgetMinor: { type: [integer, 'null'] }
                drawTogetherAt: { anyOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
                receiverGuest: { type: [string, 'null'], description: 'Their person, when it is another guest (by name; no list)' }
            - { type: 'null' }
        wishes: { type: array, description: 'As a giver sees them, without anyone''s name on a gift (the guest''s own marked mine)', items: { $ref: '#/components/schemas/Wish' } }
        questions: { type: array, items: { $ref: '#/components/schemas/AskedQuestion' } }
        lastDay: { description: 'A draw link: the last day it works', anyOf: [{ $ref: '#/components/schemas/Day' }, { type: 'null' }] }
        reissued:
          description: 'The link got a new address (on, household day) and when its earlier address was last used (null: never opened); null when it never got one'
          anyOf:
            - type: object
              additionalProperties: false
              required: [on, count, earlierLastUsedOn]
              properties:
                on: { $ref: '#/components/schemas/Day' }
                count: { type: integer, minimum: 1, description: 'How many new addresses the link has had (the guest knows how often she asked)' }
                earlierLastUsedOn: { anyOf: [{ $ref: '#/components/schemas/Day' }, { type: 'null' }] }
            - { type: 'null' }

    ImportInput:
      type: object
      additionalProperties: false
      required: [csv]
      properties:
        csv: { type: string, minLength: 1, maxLength: 524288, description: 'The sheet''s "Gift List" tab as CSV: Person, Item, Link, Priority, Status, Bought by, Price, Occasion, Notes (at most 2000 rows)' }
        people:
          description: 'A name in the file → someone of the household, or null to skip their rows'
          type: object
          maxProperties: 200
          additionalProperties: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        occasions:
          description: 'An occasion in the file → a celebration, or null for any time'
          type: object
          maxProperties: 200
          additionalProperties: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }

    ImportPlan:
      type: object
      additionalProperties: false
      required: [rows, people, occasions, buyers, wishes, claims, skipped, warnings, ready]
      properties:
        rows: { type: integer }
        people:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, personId, status, rows]
            properties:
              name: { type: string }
              personId: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
              status: { enum: [matched, mapped, skipped, unmapped] }
              rows: { type: integer }
        occasions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, celebrationId, status, rows]
            properties:
              name: { type: string }
              celebrationId: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
              status: { enum: [matched, mapped, any, unmatched] }
              rows: { type: integer }
        buyers:
          type: array
          description: '"Bought by" names on Reserved rows: someone of the household (matched or mapped like the people) or null'
          items:
            type: object
            additionalProperties: false
            required: [name, personId, rows]
            properties:
              name: { type: string }
              personId: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
              rows: { type: integer }
        wishes: { type: integer }
        claims: { type: integer }
        skipped:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [row, reason]
            properties:
              row: { type: integer, description: 'The row in the sheet (its header is row 1)' }
              reason: { enum: [no_person, no_item, bought, person_skipped, person_unmapped, item_too_long, list_full] }
        warnings:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [row, kind]
            properties:
              row: { type: integer }
              kind: { enum: [link_dropped, price_dropped, buyer_unknown, not_in_celebration, note_cut] }
        ready: { type: boolean, description: 'Every name is matched, mapped or skipped' }

    ImportDone:
      type: object
      additionalProperties: false
      required: [wishes, claims, skipped]
      properties:
        wishes: { type: integer }
        claims: { type: integer }
        skipped: { type: integer }

    Poster: { enum: [pine, berry, night, gold] }
    Recurrence: { enum: [none, yearly] }

    Celebration:
      type: object
      additionalProperties: false
      required: [id, name, date, nextDate, daysUntil, upcoming, place, poster, recurrence, host, people, toApprove, canEdit]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        date: { $ref: '#/components/schemas/Day' }
        nextDate: { $ref: '#/components/schemas/Day' }
        daysUntil: { type: integer, description: 'From today in the household''s time zone to nextDate (negative: past)' }
        upcoming: { type: boolean }
        place: { type: [string, 'null'] }
        poster: { $ref: '#/components/schemas/Poster' }
        recurrence: { $ref: '#/components/schemas/Recurrence' }
        host:
          anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }]
        people: { type: array, items: { $ref: '#/components/schemas/Id' } }
        toApprove: { type: integer, description: 'Wishes for it waiting for the caller''s yes' }
        canEdit: { type: boolean }
        draw:
          description: Its latest draw, in short (no pairs), or none
          anyOf: [{ $ref: '#/components/schemas/DrawSummary' }, { type: 'null' }]

    DrawSummary:
      type: object
      additionalProperties: false
      required: [year, on, drawn, opened, total, mine]
      properties:
        year: { type: integer }
        on: { $ref: '#/components/schemas/Day' }
        drawn: { type: boolean }
        opened: { type: integer, description: 'How many have opened theirs (never who)' }
        total: { type: integer }
        mine: { enum: [out, waiting, ready, opened], description: 'out: not in it; waiting: not drawn yet, or before the draw-together time; ready: to open' }

    Draw:
      type: object
      additionalProperties: false
      required: [celebrationId, year, on, budgetMinor, kidsDraw, notLastYear, drawTogetherAt, revealOn, people, guests, exclusions, drawn, redrawnAt, opened, total, over, revealed, canManage, canRedraw, mine, pairs]
      properties:
        celebrationId: { $ref: '#/components/schemas/Id' }
        year: { type: integer }
        on: { $ref: '#/components/schemas/Day', description: 'Its day: the celebration''s day that year' }
        budgetMinor: { type: [integer, 'null'], description: 'In minor units of the household''s currency' }
        kidsDraw: { type: boolean }
        notLastYear: { type: boolean }
        drawTogetherAt: { anyOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }], description: 'Nobody opens theirs before it' }
        revealOn: { anyOf: [{ $ref: '#/components/schemas/Day' }, { type: 'null' }], description: 'From this day on (always after the celebration) the participants see every pair; null: never' }
        people: { type: array, description: 'Who of the household draws', items: { $ref: '#/components/schemas/PersonRef' } }
        guests: { type: array, description: 'The guests who joined by a personal draw link (their names)', items: { type: string } }
        exclusions:
          description: 'Who shouldn''t draw whom (both ways): for its host only, null for everyone else'
          anyOf:
            - { type: array, items: { type: array, minItems: 2, maxItems: 2, items: { $ref: '#/components/schemas/PersonRef' } } }
            - { type: 'null' }
        drawn: { type: boolean }
        redrawnAt: { anyOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }], description: 'Set when the names were drawn again after someone had opened theirs: everyone opens theirs again' }
        opened: { type: integer, description: 'How many have opened theirs (never who)' }
        total: { type: integer }
        over: { type: boolean, description: 'Its day has come: only the reveal date changes now' }
        revealed: { type: boolean }
        canManage: { type: boolean }
        canRedraw: { type: boolean, description: 'For its host: whether the names may be drawn (again) or the rules changed now' }
        mine:
          description: 'The caller''s own part, if they are in it: their person only once they opened theirs'
          anyOf:
            - type: object
              additionalProperties: false
              required: [opened, canOpen, receiver, receiverGuest, unreadable, sealed]
              properties:
                opened: { type: boolean }
                canOpen: { type: boolean }
                receiver: { anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
                receiverGuest: { type: boolean, description: 'Their person is a guest (no list in Keepsake)' }
                unreadable: { type: boolean, description: 'Their row does not open with the keys on the server (a lost key): the host draws again' }
                sealed: { type: boolean, description: 'Their passkeys were reset: the draw stays sealed to them until they confirm the reset on their new device (Gate routes M1)' }
            - { type: 'null' }
        pairs:
          description: 'Every giver and their person: only after the reveal date, only for the participants and the host'
          anyOf:
            - type: array
              items:
                type: object
                additionalProperties: false
                required: [giver, receiver]
                properties:
                  giver: { anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
                  receiver: { anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
            - { type: 'null' }

    DrawInput:
      type: object
      additionalProperties: false
      required: [people]
      properties:
        people: { type: array, maxItems: 100, description: 'Who draws: the celebration''s people (kids only with kidsDraw)', items: { $ref: '#/components/schemas/Id' } }
        exclusions: { $ref: '#/components/schemas/Exclusions' }
        kidsDraw: { type: boolean, default: false }
        notLastYear: { type: boolean, default: false }
        budgetMinor: { type: [integer, 'null'], minimum: 1, maximum: 100000000 }
        drawTogetherAt: { anyOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        revealOn: { anyOf: [{ $ref: '#/components/schemas/Day' }, { type: 'null' }], description: 'A day after the celebration, or null (never, the default)' }

    DrawPatch:
      type: object
      additionalProperties: false
      properties:
        people: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/Id' } }
        exclusions: { $ref: '#/components/schemas/Exclusions' }
        kidsDraw: { type: boolean }
        notLastYear: { type: boolean }
        budgetMinor: { type: [integer, 'null'], minimum: 1, maximum: 100000000 }
        drawTogetherAt: { anyOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        revealOn: { anyOf: [{ $ref: '#/components/schemas/Day' }, { type: 'null' }] }

    Exclusions:
      type: array
      maxItems: 200
      description: 'Pairs of people of the draw who never draw each other, either way'
      items: { type: array, minItems: 2, maxItems: 2, items: { $ref: '#/components/schemas/Id' } }

    CelebrationInput:
      type: object
      additionalProperties: false
      required: [name, date, poster, recurrence, people]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        date: { $ref: '#/components/schemas/Day' }
        place: { type: [string, 'null'], maxLength: 80 }
        poster: { $ref: '#/components/schemas/Poster' }
        recurrence: { $ref: '#/components/schemas/Recurrence' }
        people: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/Id' } }

    CelebrationPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        date: { $ref: '#/components/schemas/Day' }
        place: { type: [string, 'null'], maxLength: 80 }
        poster: { $ref: '#/components/schemas/Poster' }
        recurrence: { $ref: '#/components/schemas/Recurrence' }
        people: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/Id' } }

    Celebrations:
      type: object
      additionalProperties: false
      required: [upcoming, past]
      properties:
        upcoming: { type: array, items: { $ref: '#/components/schemas/Celebration' } }
        past: { type: array, items: { $ref: '#/components/schemas/Celebration' } }

    PersonList:
      description: One person's list for a celebration
      type: object
      additionalProperties: false
      required: [person, wishes]
      properties:
        person: { $ref: '#/components/schemas/Person' }
        wishes: { type: array, items: { $ref: '#/components/schemas/Wish' } }

    CelebrationPage:
      type: object
      additionalProperties: false
      required: [celebration, lists]
      properties:
        celebration: { $ref: '#/components/schemas/Celebration' }
        lists: { type: array, items: { $ref: '#/components/schemas/PersonList' } }

    PersonPage:
      type: object
      additionalProperties: false
      required: [person, profile, celebrations, wishes, keeps, reminder]
      properties:
        reminder: { description: 'The caller''s own "Remind me" about them (days before each of their celebrations), or null; always null on one''s own page', anyOf: [{ type: integer, minimum: 1, maximum: 60 }, { type: 'null' }] }
        questions:
          description: 'Only for someone giving to them (a grown-up who is not the person): their questions once delivered, without askers; the caller''s own from the moment they asked, marked mine. Absent for the person and kids'
          type: array
          items: { $ref: '#/components/schemas/AskedQuestion' }
        ideas:
          description: 'Gift ideas for them: only for a grown-up who is not the person; absent, not empty, for the person and kids'
          type: array
          items: { $ref: '#/components/schemas/Idea' }
        person: { $ref: '#/components/schemas/Person' }
        profile: { $ref: '#/components/schemas/Profile' }
        celebrations: { type: array, description: 'Coming up, with this person in them (the chips)', items: { $ref: '#/components/schemas/Celebration' } }
        wishes: { type: array, description: 'Theirs that the caller may see, filtered by `for`', items: { $ref: '#/components/schemas/Wish' } }
        keeps: { type: boolean, description: 'Whether the caller keeps this person''s list and profile' }

    Home:
      type: object
      additionalProperties: false
      required: [next, celebrations, wishes, suggestions, toApprove, suggested, thanks, thanked, gave, questions]
      properties:
        thanked: { type: array, description: 'Thank-yous for gifts the caller gave (always empty for kids)', items: { $ref: '#/components/schemas/ThankedYou' } }
        questions: { type: array, description: 'Questions for the caller (and, for a kid''s parent, the kid''s) delivered and waiting for an answer; never who asked. Always empty for kids', items: { $ref: '#/components/schemas/QuestionToAnswer' } }
        next:
          description: The next celebration the caller is part of
          anyOf: [{ $ref: '#/components/schemas/Celebration' }, { type: 'null' }]
        celebrations: { type: array, description: 'Coming up, with the caller in them (the chips)', items: { $ref: '#/components/schemas/Celebration' } }
        wishes: { type: array, description: 'The caller''s listed and waiting wishes, filtered by `for`', items: { $ref: '#/components/schemas/Wish' } }
        suggestions: { type: array, description: 'Suggestions for the caller, waiting for their yes', items: { $ref: '#/components/schemas/Wish' } }
        toApprove: { type: array, description: 'Kids'' wishes and suggestions waiting for the caller as their manager', items: { $ref: '#/components/schemas/Wish' } }
        suggested: { type: array, description: 'The caller''s suggestions for others, still waiting', items: { $ref: '#/components/schemas/Wish' } }
        thanks: { type: array, description: 'Gifts the caller received, and for a kid''s parent the kid''s, after their celebration, with the givers who chose to be named', items: { $ref: '#/components/schemas/Thanks' } }
        gave: { type: array, description: 'Gifts the caller gave, after their celebration: where they put their name on each', items: { $ref: '#/components/schemas/Gave' } }
