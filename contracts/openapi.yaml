openapi: 3.1.0
info:
  title: Keepsake API
  version: 0.1.0
  description: |
    HTTP API of Keepsake. Same under HomersLab and standalone (ADR 0001). Deny by default: every operation needs a
    person unless it declares `security: []`. Every request that changes something carries Keepsake's own Origin
    (KEEPSAKE_ORIGIN), in both modes. Every answer about the household is built by one view layer (`viewFor(viewer)`,
    ADR 0003): claims and group-gift shares (M2), ideas and the asker of a question (M4) are never sent to the
    person a wish is for, nor to a kid (the asker to nobody but themselves). Guests (M4, ADR 0009) use their own short
    session (`guestSession`), made from a link's token by `POST /guest/session`, and reach only `/guest/*`. docs/security.md lists each route's actor and control.
servers: [{ url: /api }]
security: [ { homerslabPerson: [] }, { session: [] } ]
tags:
  - { name: system }
  - { name: sign-in, description: 'Standalone only (passkeys, Philobiblos ADR 0010); 404 under HomersLab' }
  - { name: household }
  - { name: wishes }
  - { name: gifts, description: 'Claims and group gifts: givers only (not the wish''s person, not a kid; ADR 0003)' }
  - { name: celebrations }
  - { name: draws, description: 'Draw names (ADR 0004): each giver learns only their own person, every pair only after the host''s reveal date' }
  - { name: questions, description: 'Anonymous questions (ADR 0008): delivered at 08:00 household time the next day; the asker is sent to nobody but themselves' }
  - { name: ideas, description: 'Gift ideas for a person: for the other grown-ups only, never the person or a kid' }
  - { name: links, description: 'Guest links (ADR 0009): share links and personal draw links, made, listed and revoked by the household' }
  - { name: guest, description: 'What a guest with a link may do: see, name themselves, claim, open their draw, ask (ADR 0009)' }
  - { name: import, description: 'The one-time sheet import (ADR 0005): admins only, a dry run first, nothing of the file kept' }
  - { name: notices, description: 'What is new for the caller, Web Push, "Remind me" and thank-yous (ADR 0010): a push says only "Something new in Keepsake"; nothing that is hidden from the caller ever makes a notice' }
  - { name: add-from-a-link, description: 'A shop page read for a wish''s name and price (ADR 0011): only the shops on the server''s list, through its one egress client; nothing stored' }

paths:
  /health:
    get:
      tags: [system]
      operationId: health
      summary: Whether the server runs, its version and mode (public; says nothing about the household)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /auth/session:
    get:
      tags: [sign-in]
      operationId: authSession
      summary: Who is signed in, and whether the household still needs its first admin
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }

  /auth/enrol/options:
    post:
      tags: [sign-in]
      operationId: enrolOptions
      summary: Starts making a passkey from a one-time link (the setup link names the first admin)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrolOptionsInput' }
      responses:
        '200':
          description: The WebAuthn options
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrolStart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooMany' }

  /auth/enrol/verify:
    post:
      tags: [sign-in]
      operationId: enrolVerify
      summary: Finishes making the passkey and signs in (spends the link)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialInput' }
      responses:
        '200':
          description: Signed in (Set-Cookie __Host-keepsake_session)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooMany' }

  /auth/sign-in/options:
    post:
      tags: [sign-in]
      operationId: signInOptions
      summary: Starts a passkey sign-in
      security: []
      responses:
        '200':
          description: The WebAuthn options
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignInStart' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooMany' }

  /auth/sign-in/verify:
    post:
      tags: [sign-in]
      operationId: signInVerify
      summary: Finishes the sign-in (one answer for every failure)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialInput' }
      responses:
        '200':
          description: Signed in (Set-Cookie __Host-keepsake_session)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooMany' }

  /auth/sign-out:
    post:
      tags: [sign-in]
      operationId: signOut
      summary: Ends this browser's session
      security: []
      responses:
        '204': { description: Signed out }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/passkeys/invite:
    post:
      tags: [sign-in]
      operationId: inviteSelf
      summary: A one-time link (24 hours) to add a passkey on another device; needs a sign-in of the last 10 minutes
      responses:
        '201':
          description: The link (shown once)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OneTimeLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/passkeys:
    get:
      tags: [sign-in]
      operationId: listPasskeys
      summary: Your passkeys, and who invited each (standalone)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Passkeys' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/passkeys/{passkeyId}:
    parameters:
      - { $ref: '#/components/parameters/passkeyId' }
    delete:
      tags: [sign-in]
      operationId: removePasskey
      summary: Removes one of your passkeys and the sessions it signed in; your last one stays (standalone)
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/sessions/end:
    post:
      tags: [sign-in]
      operationId: signOutEverywhere
      summary: Ends every session of yours, this one too (standalone)
      responses:
        '204': { description: Signed out everywhere }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /people/{personId}/sessions/end:
    parameters:
      - { $ref: '#/components/parameters/personId' }
    post:
      tags: [sign-in]
      operationId: endSessions
      summary: 'Ends someone''s sessions after a lost device (a kid''s parent, or an admin; standalone). Their devices stay subscribed to push, and they are told who did it (audited `sessions_ended`); refused while a reset of their sign-in waits (Gate re-attack 2, C2)'
      responses:
        '204': { description: Signed out everywhere }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /people/{personId}/passkeys/reset:
    parameters:
      - { $ref: '#/components/parameters/personId' }
    post:
      tags: [sign-in]
      operationId: resetPasskeys
      summary: >-
        For someone who lost every device: the first call asks for a reset, and nothing is reset yet (Gate routes M1,
        re-attack B1). A second admin's call is their yes, if they were an admin with a passkey of their own a week
        before the ask and no passkey of theirs came from the asker's invite; an hour after that yes the asker or they
        carry it out with the same call. Otherwise its asker alone, a day after the ask. Carried out, it removes their
        passkeys, ends their sessions and spends their open links; then an admin sends the usual invite, and their
        draws stay sealed to them until they confirm on their new device. An admin who signed in with a passkey in
        the last 5 minutes, for someone who is not and was not lately an admin (an admin recovers with `keepsake
        recover`). When it is asked and when it is done, the person (pushed at once), the other admins, the people of
        their open draws and a kid's parents are told. Audited. Standalone.
      responses:
        '200':
          description: The reset, asked or done
          content: { application/json: { schema: { $ref: '#/components/schemas/PasskeyReset' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [sign-in]
      operationId: cancelPasskeyReset
      summary: Calls off a reset that waits (the person, from a device they still have, or any admin; a sign-in of the last 10 minutes). Audited. Standalone
      responses:
        '204': { description: Called off }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/reset/confirm:
    post:
      tags: [sign-in]
      operationId: confirmPasskeyReset
      summary: On the new device, the person whose passkeys were reset confirms it; their draws open to them again (a sign-in of the last 10 minutes). Audited. Standalone
      responses:
        '204': { description: Confirmed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /household:
    get:
      tags: [household]
      operationId: getHousehold
      summary: The household (everyone in it sees it)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Household' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [household]
      operationId: editHousehold
      summary: The household's currency (admins)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HouseholdPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Household' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /people:
    post:
      tags: [household]
      operationId: addPerson
      summary: Adds someone to the household (admins, standalone; 409 under HomersLab)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonInput' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /people/{personId}:
    parameters:
      - { $ref: '#/components/parameters/personId' }
    get:
      tags: [household]
      operationId: getPerson
      summary: A person's page as the caller sees it (profile, celebrations, the wishes the caller may see)
      parameters:
        - { $ref: '#/components/parameters/for' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [household]
      operationId: editPerson
      summary: A person's name or role (admins, standalone; 409 under HomersLab)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [household]
      operationId: removePerson
      summary: Removes someone and everything theirs (admins, standalone; 409 under HomersLab)
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /people/{personId}/managers:
    parameters:
      - { $ref: '#/components/parameters/personId' }
    put:
      tags: [household]
      operationId: setManagers
      summary: Who manages a kid (admins, both modes); none set means the admins
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagersInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /people/{personId}/invites:
    parameters:
      - { $ref: '#/components/parameters/personId' }
    post:
      tags: [household]
      operationId: invitePerson
      summary: A one-time link (7 days) for someone without a passkey (admins, standalone, a sign-in of the last 10 minutes)
      responses:
        '201':
          description: The link (shown once)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OneTimeLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /people/{personId}/profile:
    parameters:
      - { $ref: '#/components/parameters/personId' }
    put:
      tags: [household]
      operationId: setProfile
      summary: Sizes, likes and "please no" (the person, or a kid's manager); a part that changes gets today's date
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /people/{personId}/wish-order:
    parameters:
      - { $ref: '#/components/parameters/personId' }
    put:
      tags: [wishes]
      operationId: setWishOrder
      summary: The order of a person's wishes (the person, or a kid's manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WishOrder' }
      responses:
        '204': { description: Ordered }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /home:
    get:
      tags: [wishes]
      operationId: getHome
      summary: My wishes (the home screen) with the next celebration, the chips, suggestions and approvals waiting
      parameters:
        - { $ref: '#/components/parameters/for' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Home' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /wishes:
    post:
      tags: [wishes]
      operationId: addWish
      summary: A wish for yourself, a kid you manage, or a suggestion for someone else (a list holds 300; 30 suggestions from one person wait for another)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WishInput' }
      responses:
        '201':
          description: Added (its state says whether it waits)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wish' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /wishes/{wishId}:
    parameters:
      - { $ref: '#/components/parameters/wishId' }
    patch:
      tags: [wishes]
      operationId: editWish
      summary: Changes a wish (its keeper; a suggestion's author while it waits)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WishPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wish' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [wishes]
      operationId: removeWish
      summary: Removes a wish (same people as changing it)
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /wishes/{wishId}/approve:
    parameters:
      - { $ref: '#/components/parameters/wishId' }
    post:
      tags: [wishes]
      operationId: approveWish
      summary: Yes to a suggestion (the person or a kid's manager) or to a kid's wish (its manager)
      responses:
        '200':
          description: Approved (a kid's yes to a suggestion still waits for a manager)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wish' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /wishes/{wishId}/decline:
    parameters:
      - { $ref: '#/components/parameters/wishId' }
    post:
      tags: [wishes]
      operationId: declineWish
      summary: No to a suggestion or a kid's wish (it is removed)
      responses:
        '204': { description: Declined }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /wishes/{wishId}/claim:
    parameters:
      - { $ref: '#/components/parameters/wishId' }
    put:
      tags: [gifts]
      operationId: claimWish
      summary: 'I''ll get this, or how many of it (a giver: not the wish''s person, not a kid; not on a group gift)'
      description: The person's and a kid's answer is a 403 decided before anything about the wish's gifts is read, so it is the same whatever the gifts are (ADR 0003).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
      responses:
        '200': { $ref: '#/components/responses/GiverWish' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    patch:
      tags: [gifts]
      operationId: editClaim
      summary: Your claim bought, given, or back (a given gift whose celebration is over stays given)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimPatch' }
      responses:
        '200': { $ref: '#/components/responses/GiverWish' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [gifts]
      operationId: unclaimWish
      summary: Takes back your claim (not once it is given)
      responses:
        '204': { description: Taken back }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /wishes/{wishId}/imported-claim:
    parameters:
      - { $ref: '#/components/parameters/wishId' }
    delete:
      tags: [gifts]
      operationId: releaseImportedClaim
      summary: 'An admin releases the wish''s imported reservation (refused first, like any giving, to its person and kids); a given one stays'
      responses:
        '204': { description: Released }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /wishes/{wishId}/named:
    parameters:
      - { $ref: '#/components/parameters/wishId' }
    put:
      tags: [gifts]
      operationId: nameOnGift
      summary: After the celebration, puts your name on a gift you gave (or takes it off) so its person can thank you; off by default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedInput' }
      responses:
        '200': { $ref: '#/components/responses/GiverWish' }
