openapi: 3.1.0
info:
  title: Keepsake API
  version: 0.1.0
  description: |
    HTTP API of Keepsake. Same under HomersLab and standalone (ADR 0001). Deny by default: every operation needs a
    person unless it declares `security: []`. Every request that changes something carries Keepsake's own Origin
    (KEEPSAKE_ORIGIN), in both modes. Every answer about the household is built by one view layer (`viewFor(viewer)`,
    ADR 0003): claims and group-gift shares (M2), ideas and the asker of a question (later milestones) are never sent to the
    person a wish is for, nor to a kid. docs/security.md lists each route's actor and control.
servers: [{ url: /api }]
security: [ { homerslabPerson: [] }, { session: [] } ]
tags:
  - { name: system }
  - { name: sign-in, description: 'Standalone only (passkeys, Philobiblos ADR 0010); 404 under HomersLab' }
  - { name: household }
  - { name: wishes }
  - { name: gifts, description: 'Claims and group gifts: givers only (not the wish''s person, not a kid; ADR 0003)' }
  - { name: celebrations }

paths:
  /health:
    get:
      tags: [system]
      operationId: health
      summary: Whether the server runs, its version and mode (public; says nothing about the household)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /auth/session:
    get:
      tags: [sign-in]
      operationId: authSession
      summary: Who is signed in, and whether the household still needs its first admin
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }

  /auth/enrol/options:
    post:
      tags: [sign-in]
      operationId: enrolOptions
      summary: Starts making a passkey from a one-time link (the setup link names the first admin)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrolOptionsInput' }
      responses:
        '200':
          description: The WebAuthn options
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrolStart' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooMany' }

  /auth/enrol/verify:
    post:
      tags: [sign-in]
      operationId: enrolVerify
      summary: Finishes making the passkey and signs in (spends the link)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialInput' }
      responses:
        '200':
          description: Signed in (Set-Cookie keepsake_session)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooMany' }

  /auth/sign-in/options:
    post:
      tags: [sign-in]
      operationId: signInOptions
      summary: Starts a passkey sign-in
      security: []
      responses:
        '200':
          description: The WebAuthn options
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignInStart' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooMany' }

  /auth/sign-in/verify:
    post:
      tags: [sign-in]
      operationId: signInVerify
      summary: Finishes the sign-in (one answer for every failure)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialInput' }
      responses:
        '200':
          description: Signed in (Set-Cookie keepsake_session)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooMany' }

  /auth/sign-out:
    post:
      tags: [sign-in]
      operationId: signOut
      summary: Ends this browser's session
      security: []
      responses:
        '204': { description: Signed out }
        '403': { $ref: '#/components/responses/Forbidden' }

  /me/passkeys/invite:
    post:
      tags: [sign-in]
      operationId: inviteSelf
      summary: A one-time link (24 hours) to add a passkey on another device; needs a sign-in of the last 10 minutes
      responses:
        '201':
          description: The link (shown once)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OneTimeLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/passkeys:
    get:
      tags: [sign-in]
      operationId: listPasskeys
      summary: Your passkeys, and who invited each (standalone)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Passkeys' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/passkeys/{passkeyId}:
    parameters:
      - { $ref: '#/components/parameters/passkeyId' }
    delete:
      tags: [sign-in]
      operationId: removePasskey
      summary: Removes one of your passkeys and the sessions it signed in; your last one stays (standalone)
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/sessions/end:
    post:
      tags: [sign-in]
      operationId: signOutEverywhere
      summary: Ends every session of yours, this one too (standalone)
      responses:
        '204': { description: Signed out everywhere }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /people/{personId}/sessions/end:
    parameters:
      - { $ref: '#/components/parameters/personId' }
    post:
      tags: [sign-in]
      operationId: endSessions
      summary: Ends someone's sessions after a lost device (a kid's parent, or an admin; standalone)
      responses:
        '204': { description: Signed out everywhere }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /people/{personId}/passkeys/reset:
    parameters:
      - { $ref: '#/components/parameters/personId' }
    post:
      tags: [sign-in]
      operationId: resetPasskeys
      summary: >-
        Removes the passkeys of someone who lost every device, ending their sessions and spending their open links;
        then an admin sends the usual invite. An admin who signed in with a passkey in the last 5 minutes, for someone
        who is not an admin (an admin recovers with `keepsake recover`). Recorded in the audit table. Standalone.
      responses:
        '204': { description: Their passkeys and sessions are gone }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /household:
    get:
      tags: [household]
      operationId: getHousehold
      summary: The household (everyone in it sees it)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Household' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [household]
      operationId: editHousehold
      summary: The household's currency (admins)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HouseholdPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Household' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /people:
    post:
      tags: [household]
      operationId: addPerson
      summary: Adds someone to the household (admins, standalone; 409 under HomersLab)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonInput' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /people/{personId}:
    parameters:
      - { $ref: '#/components/parameters/personId' }
    get:
      tags: [household]
      operationId: getPerson
      summary: A person's page as the caller sees it (profile, celebrations, the wishes the caller may see)
      parameters:
        - { $ref: '#/components/parameters/for' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [household]
      operationId: editPerson
      summary: A person's name or role (admins, standalone; 409 under HomersLab)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [household]
      operationId: removePerson
      summary: Removes someone and everything theirs (admins, standalone; 409 under HomersLab)
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /people/{personId}/managers:
    parameters:
      - { $ref: '#/components/parameters/personId' }
    put:
      tags: [household]
      operationId: setManagers
      summary: Who manages a kid (admins, both modes); none set means the admins
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagersInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /people/{personId}/invites:
    parameters:
      - { $ref: '#/components/parameters/personId' }
    post:
      tags: [household]
      operationId: invitePerson
      summary: A one-time link (7 days) for someone without a passkey (admins, standalone, a sign-in of the last 10 minutes)
      responses:
        '201':
          description: The link (shown once)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OneTimeLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /people/{personId}/profile:
    parameters:
      - { $ref: '#/components/parameters/personId' }
    put:
      tags: [household]
      operationId: setProfile
      summary: Sizes, likes and "please no" (the person, or a kid's manager); a part that changes gets today's date
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /people/{personId}/wish-order:
    parameters:
      - { $ref: '#/components/parameters/personId' }
    put:
      tags: [wishes]
      operationId: setWishOrder
      summary: The order of a person's wishes (the person, or a kid's manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WishOrder' }
      responses:
        '204': { description: Ordered }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /home:
    get:
      tags: [wishes]
      operationId: getHome
      summary: My wishes (the home screen) with the next celebration, the chips, suggestions and approvals waiting
      parameters:
        - { $ref: '#/components/parameters/for' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Home' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /wishes:
    post:
      tags: [wishes]
      operationId: addWish
      summary: A wish for yourself, a kid you manage, or a suggestion for someone else (a list holds 300; 30 suggestions from one person wait for another)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WishInput' }
      responses:
        '201':
          description: Added (its state says whether it waits)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wish' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /wishes/{wishId}:
    parameters:
      - { $ref: '#/components/parameters/wishId' }
    patch:
      tags: [wishes]
      operationId: editWish
      summary: Changes a wish (its keeper; a suggestion's author while it waits)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WishPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wish' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [wishes]
      operationId: removeWish
      summary: Removes a wish (same people as changing it)
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /wishes/{wishId}/approve:
    parameters:
      - { $ref: '#/components/parameters/wishId' }
    post:
      tags: [wishes]
      operationId: approveWish
      summary: Yes to a suggestion (the person or a kid's manager) or to a kid's wish (its manager)
      responses:
        '200':
          description: Approved (a kid's yes to a suggestion still waits for a manager)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wish' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /wishes/{wishId}/decline:
    parameters:
      - { $ref: '#/components/parameters/wishId' }
    post:
      tags: [wishes]
      operationId: declineWish
      summary: No to a suggestion or a kid's wish (it is removed)
      responses:
        '204': { description: Declined }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /wishes/{wishId}/claim:
    parameters:
      - { $ref: '#/components/parameters/wishId' }
    put:
      tags: [gifts]
      operationId: claimWish
      summary: 'I''ll get this, or how many of it (a giver: not the wish''s person, not a kid; not on a group gift)'
      description: The person's and a kid's answer is a 403 decided before anything about the wish's gifts is read, so it is the same whatever the gifts are (ADR 0003).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimInput' }
      responses:
        '200': { $ref: '#/components/responses/GiverWish' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    patch:
      tags: [gifts]
      operationId: editClaim
      summary: Your claim bought, given, or back (a given gift whose celebration is over stays given)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimPatch' }
      responses:
        '200': { $ref: '#/components/responses/GiverWish' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [gifts]
      operationId: unclaimWish
      summary: Takes back your claim (not once it is given)
      responses:
        '204': { description: Taken back }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /wishes/{wishId}/named:
    parameters:
      - { $ref: '#/components/parameters/wishId' }
    put:
      tags: [gifts]
      operationId: nameOnGift
      summary: After the celebration, puts your name on a gift you gave (or takes it off) so its person can thank you; off by default
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NamedInput' }
      responses:
        '200': { $ref: '#/components/responses/GiverWish' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /wishes/{wishId}/group:
    parameters:
      - { $ref: '#/components/parameters/wishId' }
    post:
      tags: [gifts]
      operationId: startGroupGift
      summary: Makes a wish a group gift with a target (a giver; not a wish someone has claimed; the household's currency first)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupInput' }
      responses:
        '200': { $ref: '#/components/responses/GiverWish' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    patch:
      tags: [gifts]
      operationId: editGroupGift
      summary: The target (while open) or the state, by whoever started it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupPatch' }
      responses:
        '200': { $ref: '#/components/responses/GiverWish' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [gifts]
      operationId: endGroupGift
      summary: Back to a plain wish, while nobody else has chipped in
      responses:
        '204': { description: Ended }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /wishes/{wishId}/group/share:
    parameters:
      - { $ref: '#/components/parameters/wishId' }
    put:
      tags: [gifts]
      operationId: chipIn
      summary: Chips in, or changes your share, while the group gift is open
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareInput' }
      responses:
        '200': { $ref: '#/components/responses/GiverWish' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [gifts]
      operationId: withdrawShare
      summary: Takes your share back while the group gift is open
      responses:
        '204': { description: Taken back }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /celebrations:
    get:
      tags: [celebrations]
      operationId: listCelebrations
      summary: Coming up (by next date) and past ones
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Celebrations' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [celebrations]
      operationId: addCelebration
      summary: A new celebration, hosted by the caller (grown-ups)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CelebrationInput' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Celebration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /celebrations/{celebrationId}:
    parameters:
      - { $ref: '#/components/parameters/celebrationId' }
    get:
      tags: [celebrations]
      operationId: getCelebration
      summary: A celebration's page with each person's list for it (their wishes for it and their any-time wishes)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CelebrationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [celebrations]
      operationId: editCelebration
      summary: Changes a celebration (its host or an admin); someone taken out keeps their wishes for any time
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CelebrationPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Celebration' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [celebrations]
      operationId: removeCelebration
      summary: Removes a celebration (its host or an admin); its wishes stay, for any time
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    homerslabPerson:
      type: apiKey
      in: header
      name: X-HomersLab-Person
      description: 'homerslab mode: set by the edge with X-HomersLab-Name and X-HomersLab-Role, trusted only from KEEPSAKE_TRUSTED_PROXY (the socket address) once KEEPSAKE_EDGE_IDENTITY=homerslab-v1 (ADR 0001)'
    session:
      type: apiKey
      in: cookie
      name: keepsake_session
      description: 'standalone: a passkey session (HttpOnly; Secure; SameSite=Strict; 30 days, 7 idle)'

  parameters:
    personId:
      name: personId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    wishId:
      name: wishId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    celebrationId:
      name: celebrationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    passkeyId:
      name: passkeyId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,1400}$' }
    for:
      name: for
      in: query
      required: false
      description: 'A celebration''s id (its wishes and the any-time ones: the list for it), or `any` (any-time wishes only); absent: all'
      schema: { type: string, pattern: '^(any|[0-9A-Za-z_-]{1,40})$' }

  responses:
    BadRequest:
      description: The request is not valid
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Sign in first
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Not allowed (or a change without Keepsake's Origin)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: No such thing, or not one the caller may see
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Not possible in this state
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    GiverWish:
      description: The wish as the giver sees it now (with its gifts)
      content: { application/json: { schema: { $ref: '#/components/schemas/Wish' } } }
    TooMany:
      description: Too many tries; wait a minute
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Id: { type: string, pattern: '^[0-9A-Za-z_-]{1,40}$' }
    DateTime: { type: string, format: date-time }
    Day: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', description: 'YYYY-MM-DD' }
    Role: { enum: [admin, adult, kid] }
    Mode: { enum: [homerslab, standalone] }

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }

    Health:
      type: object
      additionalProperties: false
      required: [ok, version, mode]
      properties:
        ok: { type: boolean }
        version: { type: string }
        mode: { $ref: '#/components/schemas/Mode' }

    PersonRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }

    Person:
      type: object
      additionalProperties: false
      required: [id, name, role, managers, signsIn]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        managers:
          description: A kid's managers as set (empty for a grown-up, or when the admins manage the kid)
          type: array
          items: { $ref: '#/components/schemas/Id' }
        signsIn:
          description: 'Standalone: whether they have a passkey; null under HomersLab'
          type: [boolean, 'null']

    AuthSession:
      type: object
      additionalProperties: false
      required: [mode, signedIn, setupNeeded]
      properties:
        mode: { $ref: '#/components/schemas/Mode' }
        signedIn: { type: boolean }
        setupNeeded: { type: boolean }
        person: { $ref: '#/components/schemas/Person' }

    EnrolOptionsInput:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        name: { type: string, minLength: 1, maxLength: 60, description: 'The first admin''s name (setup link only)' }

    CredentialInput:
      type: object
      additionalProperties: false
      required: [challengeId, response]
      properties:
        challengeId: { type: string }
        response: { type: object, additionalProperties: true, description: 'The authenticator''s answer (WebAuthn JSON)' }
        label: { type: string, maxLength: 40, description: 'A name for the new passkey (enrolment only)' }

    EnrolStart:
      type: object
      additionalProperties: false
      required: [challengeId, options, person]
      properties:
        challengeId: { type: string }
        options: { type: object, additionalProperties: true }
        person:
          type: object
          additionalProperties: false
          required: [name]
          properties:
            name: { type: string }

    SignInStart:
      type: object
      additionalProperties: false
      required: [challengeId, options]
      properties:
        challengeId: { type: string }
        options: { type: object, additionalProperties: true }

    OneTimeLink:
      type: object
      additionalProperties: false
      required: [url, expiresAt]
      properties:
        url: { type: string, description: 'The token is in the #fragment' }
        expiresAt: { $ref: '#/components/schemas/DateTime' }

    Passkey:
      type: object
      additionalProperties: false
      required: [id, label, createdAt, lastUsedAt, backedUp, invitedBy]
      properties:
        id: { type: string }
        label: { type: string }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        lastUsedAt: { type: [string, 'null'], format: date-time }
        backedUp: { type: boolean, description: 'Synced by its platform (it survives a lost device)' }
        invitedBy: { type: [string, 'null'], description: 'The admin whose invite made it' }

    Passkeys:
      type: object
      additionalProperties: false
      required: [passkeys]
      properties:
        passkeys: { type: array, items: { $ref: '#/components/schemas/Passkey' } }

    Household:
      type: object
      additionalProperties: false
      required: [mode, me, people, currency]
      properties:
        mode: { $ref: '#/components/schemas/Mode' }
        me: { $ref: '#/components/schemas/Person' }
        people: { type: array, items: { $ref: '#/components/schemas/Person' } }
        currency:
          description: 'ISO 4217; null until an admin sets it (prices wait for it)'
          type: [string, 'null']

    HouseholdPatch:
      type: object
      additionalProperties: false
      required: [currency]
      properties:
        currency:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'

    PersonInput:
      type: object
      additionalProperties: false
      required: [name, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        role: { $ref: '#/components/schemas/Role' }

    PersonPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        role: { $ref: '#/components/schemas/Role' }

    ManagersInput:
      type: object
      additionalProperties: false
      required: [managerIds]
      properties:
        managerIds: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Id' } }

    Size:
      type: object
      additionalProperties: false
      required: [label, value]
      properties:
        label: { type: string, minLength: 1, maxLength: 40 }
        value: { type: string, minLength: 1, maxLength: 40 }

    Profile:
      type: object
      additionalProperties: false
      required: [sizes, sizesUpdatedAt, likes, likesUpdatedAt, pleaseNo, pleaseNoUpdatedAt]
      properties:
        sizes: { type: array, items: { $ref: '#/components/schemas/Size' } }
        sizesUpdatedAt: { type: [string, 'null'], format: date-time }
        likes: { type: array, items: { type: string } }
        likesUpdatedAt: { type: [string, 'null'], format: date-time }
        pleaseNo: { type: array, items: { type: string } }
        pleaseNoUpdatedAt: { type: [string, 'null'], format: date-time }

    ProfileInput:
      type: object
      additionalProperties: false
      properties:
        sizes: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/Size' } }
        likes: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 80 } }
        pleaseNo: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 80 } }

    WishState:
      description: 'listed: the household sees it; awaiting_parent: a kid''s, until a manager approves; suggested: someone else''s idea, until the person approves'
      enum: [listed, awaiting_parent, suggested]

    Wish:
      type: object
      additionalProperties: false
      required: [id, personId, celebrationId, name, link, priceMinor, quantity, note, mostWanted, state, addedBy, createdAt, updatedAt, canEdit, canApprove]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        personId: { $ref: '#/components/schemas/Id' }
        celebrationId:
          description: The celebration it is for; null for any time
          anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]
        name: { type: string }
        link: { type: [string, 'null'], description: 'As typed; Keepsake never fetches it' }
        priceMinor: { type: [integer, 'null'], description: 'In minor units of the household currency' }
        quantity: { type: integer, minimum: 1 }
        note: { type: [string, 'null'] }
        mostWanted: { type: boolean }
        state: { $ref: '#/components/schemas/WishState' }
        addedBy:
          description: Who added it, when someone other than the person did (a suggestion, a parent)
          anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }]
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        canEdit: { type: boolean }
        canApprove: { type: boolean }
        gift:
          description: 'Only for a giver (not its person, not a kid): absent, not null, for everyone else, whatever the gifts are'
          $ref: '#/components/schemas/Gift'

    ClaimState: { enum: [claimed, bought, given] }
    GroupState: { enum: [open, bought, given] }

    Gift:
      description: 'A wish''s gifts, only ever for a giver: never its person, never a kid (ADR 0003). Others'' shares are names, not amounts.'
      type: object
      additionalProperties: false
      required: [claimed, left, given, claims, group, mine]
      properties:
        claimed: { type: integer, minimum: 0, description: 'How many are claimed' }
        left: { type: integer, minimum: 0, description: 'How many are left to claim (0 for a group gift)' }
        given: { type: boolean, description: 'All given: gone from every list for givers' }
        claims: { type: array, items: { $ref: '#/components/schemas/Claim' } }
        group:
          anyOf: [{ $ref: '#/components/schemas/GroupGift' }, { type: 'null' }]
        mine:
          description: The caller's own claim or share
          anyOf: [{ $ref: '#/components/schemas/MyGift' }, { type: 'null' }]

    Claim:
      type: object
      additionalProperties: false
      required: [giver, quantity, state, mine]
      properties:
        giver: { anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        quantity: { type: integer, minimum: 1 }
        state: { $ref: '#/components/schemas/ClaimState' }
        mine: { type: boolean }

    GroupGift:
      type: object
      additionalProperties: false
      required: [organizer, targetMinor, totalMinor, state, givers, myShareMinor, canManage]
      properties:
        organizer: { anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        targetMinor: { type: integer, minimum: 1 }
        totalMinor: { type: integer, minimum: 0 }
        state: { $ref: '#/components/schemas/GroupState' }
        givers:
          type: array
          description: Who chipped in (names only)
          items:
            type: object
            additionalProperties: false
            required: [giver, mine]
            properties:
              giver: { anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
              mine: { type: boolean }
        myShareMinor: { type: [integer, 'null'] }
        canManage: { type: boolean }

    MyGift:
      type: object
      additionalProperties: false
      required: [state, named, over, celebrationId, forDate]
      properties:
        state: { enum: [claimed, bought, given, open] }
        named: { type: boolean, description: 'Your name is on it for the person (after the celebration)' }
        over: { type: boolean, description: 'Given, and its celebration is over: you may put your name on it' }
        celebrationId: { anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }] }
        forDate: { anyOf: [{ $ref: '#/components/schemas/Day' }, { type: 'null' }] }

    CelebrationRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }

    Thanks:
      description: A gift the caller received, after its celebration; `from` names only the givers who chose to
      type: object
      additionalProperties: false
      required: [wish, celebration, on, from]
      properties:
        wish: { $ref: '#/components/schemas/Wish' }
        celebration: { anyOf: [{ $ref: '#/components/schemas/CelebrationRef' }, { type: 'null' }] }
        on: { $ref: '#/components/schemas/Day' }
        from: { type: array, items: { $ref: '#/components/schemas/PersonRef' } }

    Gave:
      description: A gift the caller gave, after its celebration
      type: object
      additionalProperties: false
      required: [wish, celebration, on, named]
      properties:
        wish: { $ref: '#/components/schemas/Wish' }
        celebration: { anyOf: [{ $ref: '#/components/schemas/CelebrationRef' }, { type: 'null' }] }
        on: { $ref: '#/components/schemas/Day' }
        named: { type: boolean }

    ClaimInput:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 99 }

    ClaimPatch:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { $ref: '#/components/schemas/ClaimState' }

    NamedInput:
      type: object
      additionalProperties: false
      required: [named]
      properties:
        named: { type: boolean }

    GroupInput:
      type: object
      additionalProperties: false
      required: [targetMinor]
      properties:
        targetMinor: { type: integer, minimum: 1, maximum: 100000000 }

    GroupPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        targetMinor: { type: integer, minimum: 1, maximum: 100000000 }
        state: { $ref: '#/components/schemas/GroupState' }

    ShareInput:
      type: object
      additionalProperties: false
      required: [amountMinor]
      properties:
        amountMinor: { type: integer, minimum: 1, maximum: 100000000 }

    WishInput:
      type: object
      additionalProperties: false
      required: [personId, name, celebrationId]
      properties:
        personId: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1, maxLength: 120 }
        link: { type: [string, 'null'], maxLength: 2000, description: 'http(s) only, without credentials; stored, never fetched' }
        priceMinor: { type: [integer, 'null'], minimum: 0, maximum: 100000000, description: 'Needs the household''s currency' }
        quantity: { type: integer, minimum: 1, maximum: 99, description: 'Default 1' }
        note: { type: [string, 'null'], maxLength: 500 }
        mostWanted: { type: boolean }
        celebrationId:
          description: A celebration the person is part of, or null for any time
          anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]

    WishPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        link: { type: [string, 'null'], maxLength: 2000 }
        priceMinor: { type: [integer, 'null'], minimum: 0, maximum: 100000000 }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        note: { type: [string, 'null'], maxLength: 500 }
        mostWanted: { type: boolean }
        celebrationId:
          anyOf: [{ $ref: '#/components/schemas/Id' }, { type: 'null' }]

    WishOrder:
      type: object
      additionalProperties: false
      required: [wishIds]
      properties:
        wishIds: { type: array, maxItems: 300, items: { $ref: '#/components/schemas/Id' } }

    Poster: { enum: [pine, berry, night, gold] }
    Recurrence: { enum: [none, yearly] }

    Celebration:
      type: object
      additionalProperties: false
      required: [id, name, date, nextDate, daysUntil, upcoming, place, poster, recurrence, host, people, toApprove, canEdit]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        date: { $ref: '#/components/schemas/Day' }
        nextDate: { $ref: '#/components/schemas/Day' }
        daysUntil: { type: integer, description: 'From today in the household''s time zone to nextDate (negative: past)' }
        upcoming: { type: boolean }
        place: { type: [string, 'null'] }
        poster: { $ref: '#/components/schemas/Poster' }
        recurrence: { $ref: '#/components/schemas/Recurrence' }
        host:
          anyOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }]
        people: { type: array, items: { $ref: '#/components/schemas/Id' } }
        toApprove: { type: integer, description: 'Wishes for it waiting for the caller''s yes' }
        canEdit: { type: boolean }

    CelebrationInput:
      type: object
      additionalProperties: false
      required: [name, date, poster, recurrence, people]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        date: { $ref: '#/components/schemas/Day' }
        place: { type: [string, 'null'], maxLength: 80 }
        poster: { $ref: '#/components/schemas/Poster' }
        recurrence: { $ref: '#/components/schemas/Recurrence' }
        people: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/Id' } }

    CelebrationPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        date: { $ref: '#/components/schemas/Day' }
        place: { type: [string, 'null'], maxLength: 80 }
        poster: { $ref: '#/components/schemas/Poster' }
        recurrence: { $ref: '#/components/schemas/Recurrence' }
        people: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/Id' } }

    Celebrations:
      type: object
      additionalProperties: false
      required: [upcoming, past]
      properties:
        upcoming: { type: array, items: { $ref: '#/components/schemas/Celebration' } }
        past: { type: array, items: { $ref: '#/components/schemas/Celebration' } }

    PersonList:
      description: One person's list for a celebration
      type: object
      additionalProperties: false
      required: [person, wishes]
      properties:
        person: { $ref: '#/components/schemas/Person' }
        wishes: { type: array, items: { $ref: '#/components/schemas/Wish' } }

    CelebrationPage:
      type: object
      additionalProperties: false
      required: [celebration, lists]
      properties:
        celebration: { $ref: '#/components/schemas/Celebration' }
        lists: { type: array, items: { $ref: '#/components/schemas/PersonList' } }

    PersonPage:
      type: object
      additionalProperties: false
      required: [person, profile, celebrations, wishes, keeps]
      properties:
        person: { $ref: '#/components/schemas/Person' }
        profile: { $ref: '#/components/schemas/Profile' }
        celebrations: { type: array, description: 'Coming up, with this person in them (the chips)', items: { $ref: '#/components/schemas/Celebration' } }
        wishes: { type: array, description: 'Theirs that the caller may see, filtered by `for`', items: { $ref: '#/components/schemas/Wish' } }
        keeps: { type: boolean, description: 'Whether the caller keeps this person''s list and profile' }

    Home:
      type: object
      additionalProperties: false
      required: [next, celebrations, wishes, suggestions, toApprove, suggested, thanks, gave]
      properties:
        next:
          description: The next celebration the caller is part of
          anyOf: [{ $ref: '#/components/schemas/Celebration' }, { type: 'null' }]
        celebrations: { type: array, description: 'Coming up, with the caller in them (the chips)', items: { $ref: '#/components/schemas/Celebration' } }
        wishes: { type: array, description: 'The caller''s listed and waiting wishes, filtered by `for`', items: { $ref: '#/components/schemas/Wish' } }
        suggestions: { type: array, description: 'Suggestions for the caller, waiting for their yes', items: { $ref: '#/components/schemas/Wish' } }
        toApprove: { type: array, description: 'Kids'' wishes and suggestions waiting for the caller as their manager', items: { $ref: '#/components/schemas/Wish' } }
        suggested: { type: array, description: 'The caller''s suggestions for others, still waiting', items: { $ref: '#/components/schemas/Wish' } }
        thanks: { type: array, description: 'Gifts the caller received, after their celebration, with the givers who chose to be named', items: { $ref: '#/components/schemas/Thanks' } }
        gave: { type: array, description: 'Gifts the caller gave, after their celebration: where they put their name on each', items: { $ref: '#/components/schemas/Gave' } }
